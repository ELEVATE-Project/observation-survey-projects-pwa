@if(showHeader){
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button (click)="canPageLeave($event)">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>{{"PROFILE_EDIT"|translate}}</ion-title>
    </ion-toolbar>
  </ion-header>
}

<ion-content [fullscreen]="true">
  <app-profile-image [profileImageData]='formJson' [uploadImage]="true" (imageUploadEvent)="imageUploadEvent($event)"
  (imageRemoveEvent)="imageRemoveEvent($event)"></app-profile-image>
  @if (enableForm) {
    <div class="ion-margin-top container">
      <dynamic-form [formJson]="formJson" #formLib (onChange)="onOptionChange($event)"
      (ionFocus)="handleSelectFocus($event)"></dynamic-form>
    </div>
  }
  @if (formJson2?.length > 0) {
    <div class="ion-margin-top container">
      <dynamic-form [formJson]="formJson2" #formLib2 (onChange)="onOptionChange2($event)"
      (ionFocus)="handleSelectFocus($event)"></dynamic-form>
    </div>
  }
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button (click)="updateProfile()" expand="block" fill="primary" shape="solid" class="container"
      [disabled]="!(formLib?.myForm?.valid && formLib2?.myForm?.valid)">
      {{"PROFILE_UPDATE"|translate}}
    </ion-button>
  </ion-toolbar>
</ion-footer>
