<app-header [pageTitle]="'LOCATION_DETAILS'">
</app-header>

<ion-content [fullscreen]="true">
    <div class="ion-margin-top container">
        <dynamic-form *ngIf="formJson.length" [formJson]="formJson" #formLib (onChange)="onOptionChange($event)"
            (ionFocus)="handleSelectFocus($event)"></dynamic-form>
    </div>
</ion-content>

<ion-footer>
    <ion-toolbar>
        <ion-button (click)="updateProfile()" expand="block" fill="primary" shape="solid" class="container"
            [disabled]="!(formLib?.myForm?.valid)">
            {{"LOCATION_UPDATE"|translate}}
        </ion-button>
    </ion-toolbar>
</ion-footer>
